name: Update candles
on:
  schedule:
    - cron: '7 * * * *'   # every hour, 7 minutes past
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to download (2 = normal hourly update, 730 = 2-year history)'
        default: '2'
permissions:
  contents: write
concurrency:
  group: candles
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download candles
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: node scripts/update.mjs ${{ github.event.inputs.days || '2' }}
      - name: Save to the repository
        if: always()
        run: |
          git config user.name "rd-replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No new candles"; exit 0; fi
          git commit -m "Candles $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
